<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>B41M</title>
    <style>
      :root { --ink:#071018; --panel:#101d28; --line:#294556; --cyan:#78e6e0;
              --lime:#d3f36b; --muted:#8ca6b2; --danger:#ff7890; }
      * { box-sizing:border-box; }
      html,body { min-height:100%; margin:0; background:var(--ink); color:#e8f5f4;
                  font:15px/1.5 "Trebuchet MS",sans-serif; }
      body { position:relative; overflow-x:hidden; }
      body:before { position:fixed; inset:0; pointer-events:none; content:"";
                    background:radial-gradient(circle at 85% 8%, rgba(120,230,224,.13), transparent 28%),
                                linear-gradient(135deg,#071018 0%,#0b1720 55%,#132a31 100%); }
      #brand { position:relative; z-index:1; display:flex; align-items:center; gap:14px;
               max-width:720px; margin:0 auto; padding:28px 24px 22px; border-bottom:1px solid var(--line); }
      #brand img { width:42px; height:42px; border:1px solid var(--cyan); border-radius:12px; filter:saturate(.8); }
      #brand b { color:var(--cyan); font:700 25px/1 "Trebuchet MS",sans-serif; letter-spacing:.18em; }
      #brand:after { content:"SECURE EXECUTION / 02"; margin-left:auto; color:var(--muted);
                     font:10px "Courier New",monospace; letter-spacing:.12em; }
      #spin { display:none; }
      #msg { position:fixed; top:50%; left:0; right:0; z-index:1; transform:translateY(-50%);
             text-align:center; color:var(--cyan); font-size:18px; letter-spacing:.04em; }
      #msg:before { display:block; width:46px; height:46px; margin:0 auto 18px; content:"";
                    border:2px solid rgba(120,230,224,.2); border-top-color:var(--lime);
                    border-radius:50%; animation:spin 1.1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      #wrap { position:relative; z-index:1; padding:0; }
      #state,#out { display:none; }
      body.done #msg:before { border-color:var(--lime); animation:none; }
      body.done #msg { color:var(--lime); }
      body.fail #msg:before { border-color:var(--danger); animation:none; }
      body.fail #msg { color:var(--danger); }
      body.log #msg { display:none; }
      body.log #wrap { max-width:820px; margin:38px auto; padding:30px; border:1px solid var(--line);
                       border-radius:18px; background:rgba(16,29,40,.94); box-shadow:0 22px 70px rgba(0,0,0,.28); }
      body.log #wrap:before { display:block; margin-bottom:20px; content:"B41M / EXECUTION TELEMETRY";
                              color:var(--lime); font:11px "Courier New",monospace; letter-spacing:.18em; }
      body.log #state { display:block; margin:0 0 14px; color:#f3fbf8; font-size:25px; font-weight:700; }
      body.log #state:before { content:"●"; margin-right:10px; color:var(--cyan); font-size:.55em; vertical-align:middle; }
      body.log #out { display:block; min-height:220px; height:calc(100vh - 150px); padding:18px;
                      overflow-y:auto; white-space:pre-wrap; border:1px solid #345467; border-radius:10px;
                      background:#0a151e; color:#b9d5d5; font:12px/1.55 "Courier New",monospace; }
      .ok,.safe { color:var(--lime); } .bad,.danger { color:var(--danger); }
      .warn { color:#f3d978; } code { color:var(--cyan); }
      @media (max-width:560px) { #brand { padding:22px 16px 18px; } #brand:after { display:none; }
        body.log #wrap { margin:24px 14px; padding:22px 18px; } body.log #state { font-size:20px; } }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="logo.png"
        alt="B41M"
        width="28"
        height="28"
      /><b>B41M</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Wait</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
