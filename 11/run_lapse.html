<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="icon" type="image/png" href="logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B41M | Rantai Lapse</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:#050b0c; color:#d7ebe5; font:15px/1.5 "Segoe UI", Arial, sans-serif; }
  #shell { display:flex; flex-direction:column; height:100%; padding:24px 28px 20px; }
  #brand { display:flex; align-items:center; padding:0 0 18px; border-bottom:1px solid rgba(96,255,184,.24); }
  #brand img { width:40px; height:40px; margin-right:12px; border-radius:50%; border:1px solid #42e99c; }
  .brand-copy { line-height:1.05; }
  .brand-name { display:block; color:#e8fff4; font:800 23px/1 Consolas, "Courier New", monospace; letter-spacing:.18em; }
  .brand-name:before { content:"["; margin-right:4px; color:#4bffac; font-weight:400; }
  .brand-name:after { content:"]"; margin-left:-1px; color:#4bffac; font-weight:400; }
  .brand-sub { display:block; margin-top:6px; color:#70a996; font:10px monospace; letter-spacing:.1em; }
  .brand-sub:before { content:"NODE_041 // "; color:#3df096; }
  .session { margin-left:auto; padding:6px 10px; border:1px solid rgba(59,239,152,.35); color:#6dca9d; font:10px monospace; letter-spacing:.08em; }
  #wrap { display:flex; flex:1; flex-direction:column; min-height:0; width:100%; max-width:980px; margin:22px auto 0; padding:24px; background:#0b1b1a; border:1px solid rgba(91,255,177,.32); }
  .eyebrow { margin-bottom:9px; color:#46ec9b; font:11px monospace; letter-spacing:.16em; }
  .eyebrow:before { content:"// "; color:#9effc9; }
  #state { margin:0 0 15px; color:#effff7; font-size:23px; font-weight:700; letter-spacing:.015em; text-transform:uppercase; }
  #out { flex:1; min-height:0; overflow-y:auto; padding:15px; border:1px solid rgba(87,224,163,.22); border-left:3px solid #27d889; background:#010a08; color:#a9c9bc; white-space:pre-wrap; font:12px/1.55 Consolas, "Courier New", monospace; }
  #out:empty:after { content:"Menyiapkan log eksekusi…"; color:#618276; }
  .ok { color:#8df2b7; } .bad { color:#ff897d; } .warn { color:#ffd572; }
  .footer { padding-top:13px; color:#527366; font:10px monospace; letter-spacing:.1em; text-align:center; }
  .footer span { color:#39dd91; }
  @media (max-width:560px) { #shell { padding:18px; } #wrap { margin-top:16px; padding:18px; } #state { font-size:18px; } .session { display:none; } }
</style>
</head>
<body>
<main id="shell">
  <header id="brand"><img src="logo.png" alt="Logo B41M"><div class="brand-copy"><span class="brand-name">B41M</span><span class="brand-sub">RANTAI LAPSE · KONSOL EKSEKUSI</span></div><span class="session">[ RANTAI AKTIF ]</span></header>
  <section id="wrap" aria-live="polite"><div class="eyebrow">LOG EKSEKUSI / LAPSE</div><div id="state">Memuat rantai Lapse...</div><div id="out"></div></section>
  <footer class="footer site-footer">
    <div class="footer-info"><span class="footer-label">[ALAMAT]</span> <span class="footer-value">Jl. Tahir, Muara Jawa, Kukar, KAL-TIM, Indonesia.</span></div>
    <div class="footer-info"><span class="footer-label">[KONTAK]</span> <span class="footer-value">085555551497</span></div>
    <div class="footer-info"><span class="footer-label">[COPYRIGHT]</span> <span class="footer-value">© 2026 B41M 17PlayBox</span></div>
    <div class="footer-info"><span class="footer-label">[PEMILIK]</span> <span class="footer-value">Ibrahim Yusuf</span></div>
  </footer>
</main>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
