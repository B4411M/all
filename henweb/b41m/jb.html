<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>B41M 17PlayBox // PS4 WebKit Host</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #030805;
        color: #e8fff0;
        font: 16px/1.5 "Courier New", monospace;
        border-top: 4px solid #37ee91;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #030805;
        border-bottom: 1px solid #214a36;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #42f29a;
        font-family: "Courier New", monospace;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #173624;
        border-top-color: #42f29a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 1px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #42f29a;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #07110a;
        border: 1px solid #214a36;
        border-radius: 4px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #42f29a;
      }
      .bad {
        color: #ff8585;
      }
      .warn {
        color: #f4d36f;
      }
      .safe {
        color: #42f29a;
      }
      .danger {
        color: #ff8585;
      }
      code {
        color: #a4cbb2;
      }
    
      #ramBox {
        position: fixed;

        top: 8px;
        left: 8px;
        z-index: 9999;

        padding: 6px 9px;

        color: #42f29a;
        background: rgba(3, 8, 5, 0.92);

        border:
          1px solid #214a36;

        border-radius: 4px;

        font-family:
          "Courier New",
          monospace;

        font-size: 11px;

        max-width: 92vw;
        overflow: hidden;

        text-overflow: ellipsis;
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div id="ramBox">RAM: checking...</div>
    <div id="brand">
      <img
        src="https://raw.githubusercontent.com/B4411M/all/refs/heads/main/13/logo.png"
        alt=""
        width="28"
        height="28"
      /><b>B41M 17PLAYBOX</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=31";
    </script>
  </body>
</html>
