html,body{
  margin:0;

#wrap{
  width:100%;

  line-height:1.2;

  text-shadow:0 0 6px #00ff41;
}

/* DETAIL */
#det{
  margin:0;
  font-size:13px;
  line-height:1.7;
  color:#00ff41;
}

#det b{
  color:#00ff41;
  font-weight:600;
}

/* CACHE */
#cache{
  margin-top:4px;
  min-height:16px;
  font-size:12px;
  color:#00ff41;
}

#cache.cacheok,
.ok,
.bad,
