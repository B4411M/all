<!DOCTYPE html>
<html lang="id" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="logo.png">
<title>B41M | Rantai Lapse</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:#050b0c;
  color:#d7ebe5;
  font:14px/1.5 Arial,sans-serif;
}

#shell{
  height:100%;
  padding:16px;
  display:flex;
  flex-direction:column;
}

/* BRAND */
#brand{
  display:flex;
  align-items:center;
  padding-bottom:14px;
}

#brand img{
  width:40px;
  height:40px;
  margin-right:10px;
}

.brand-name{
  display:block;
  color:#e8fff4;
  font:bold 23px/1 Consolas,monospace;
}

.brand-sub{
  display:block;
  margin-top:4px;
  color:#70a996;
  font:10px Consolas,monospace;
}

/* CONTENT */
#wrap{
  width:100%;
  max-width:980px;
  margin:14px auto 0;
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.eyebrow{
  margin-bottom:7px;
  color:#46ec9b;
  font:11px Consolas,monospace;
}

#state{
  margin:0 0 10px;
  color:#effff7;
  font-size:22px;
  font-weight:bold;
}

/* LOG */
#out{
  flex:1;
  min-height:0;
  overflow-y:auto;
  color:#a9c9bc;
  white-space:pre-wrap;
  font:12px/1.5 Consolas,monospace;
}

#out:empty:after{
  content:"Menyiapkan log eksekusi...";
  color:#618276;
}

/* STATUS */
.ok{
  color:#8df2b7;
}

.bad{
  color:#ff897d;
}

.warn{
  color:#ffd572;
}

/* FOOTER */
.footer{
  padding-top:12px;
  color:#527366;
  font:10px/1.6 Consolas,monospace;
  text-align:center;
}

.footer-info{
  display:inline;
}

.footer-info + .footer-info:before{
  content:"  ·  ";
  color:#2f8660;
}

.footer-value{
  color:#527366;
}

/* MOBILE */
@media(max-width:560px){

  #shell{
    padding:12px;
  }

  #brand img{
    width:36px;
    height:36px;
  }

  .brand-name{
    font-size:20px;
  }

  .brand-sub{
    font-size:9px;
  }

  #state{
    font-size:18px;
  }

  .footer-info{
    display:block;
  }

  .footer-info + .footer-info:before{
    content:"";
  }
}
</style>
</head>

<body>

<main id="shell">

  <header id="brand">

    <img src="logo.png" alt="B41M">

    <div>
      <span class="brand-name">B41M</span>

      <span class="brand-sub">
        RANTAI LAPSE · KONSOL EKSEKUSI
      </span>
    </div>

  </header>

  <section id="wrap" aria-live="polite">

    <div class="eyebrow">
      LOG EKSEKUSI / LAPSE
    </div>

    <div id="state">
      Memuat rantai Lapse...
    </div>

    <div id="out"></div>

  </section>

  <footer class="footer">

    <div class="footer-info">
      [ALAMAT]
      <span class="footer-value">
        Jl. Tahir, Muara Jawa, Kukar, KAL-TIM, Indonesia.
      </span>
    </div>

    <div class="footer-info">
      [KONTAK]
      <span class="footer-value">
        085555551497
      </span>
    </div>

    <div class="footer-info">
      [COPYRIGHT]
      <span class="footer-value">
        © 2026 B41M 17PlayBox
      </span>
    </div>

    <div class="footer-info">
      [PEMILIK]
      <span class="footer-value">
        Ibrahim Yusuf
      </span>
    </div>

  </footer>

</main>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
