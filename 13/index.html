<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png" type="image/png">
<title>B41M</title>
<style>
:root {
  --bg: #050b0c;
  --bg-2: #0c1718;
  --panel: rgba(9, 17, 18, 0.95);
  --panel-2: rgba(12, 22, 22, 0.88);
  --line: rgba(116, 169, 145, 0.2);
  --line-strong: rgba(70, 236, 155, 0.35);
  --text: #eafef3;
  --muted: #9bc5b1;
  --soft: #6d897d;
  --green: #8df2b7;
  --green-strong: #46ec9b;
  --warn: #dfe67c;
  --err: #ff8e7c;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 18px;
  background:
    radial-gradient(circle at top, rgba(70, 236, 155, 0.08), transparent 30%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--text);
  font: 14px/1.6 Arial, sans-serif;
}

.shell {
  width: min(760px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02),
    0 18px 44px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.02);
  padding: 22px 20px 18px;
  position: relative;
  overflow: hidden;
}

.shell::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--green-strong), rgba(70,236,155,0.12));
}

#title {
  font-size: 12px;
  color: var(--green);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 6px;
}

#sub {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 22px;
  letter-spacing: 0.04em;
  line-height: 1.5;
}

.row {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.row:last-of-type {
  border-bottom: none;
}

.k {
  color: var(--soft);
  font: 11px Consolas, monospace;
  letter-spacing: 0.08em;
  text-transform: lowercase;
}

.v {
  color: var(--text);
  font: 13px Consolas, monospace;
  word-break: break-word;
}

.v.ok { color: var(--green); }
.v.err { color: var(--err); }
.v.dim { color: var(--soft); }

#sep {
  border: none;
  border-top: 1px solid var(--line);
  margin: 18px 0 12px;
}

#note {
  font: 11px Consolas, monospace;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.9;
}

#note b { color: var(--text); }

a { color: var(--green); text-decoration: none; }
a:hover { color: var(--green-strong); }

@media (max-width: 560px) {
  body { padding: 18px 12px; }
  .shell { padding: 18px 14px; }
  .row { grid-template-columns: 94px minmax(0, 1fr); }
  #title { letter-spacing: 0.1em; }
  #sub { font-size: 10px; }
}
</style>
</head>
<body>
<div class="shell">
<div id="title">B41MHOST</div>
<div id="sub">EXPLOIT PS4 · FW 11.00 · 11.50/11.52 · 12.00/12.02 · 12.50/12.52 · 13.00/13.02/13.04/13.50/13.52</div>

<div class="row"><span class="k">firmware</span><span class="v" id="v-fw">detecting…</span></div>
<div class="row"><span class="k">chain</span>   <span class="v" id="v-ch">—</span></div>
<div class="row"><span class="k">offsets</span> <span class="v" id="v-off">—</span></div>
<div class="row"><span class="k">status</span>  <span class="v" id="v-st">—</span></div>

<hr id="sep">

<div id="note"></div>
</div>

<script type="module">
import { offsetsFor } from "./ps4_offsets.mjs";

const $ = id => document.getElementById(id);
function set(id, txt, cls) {
    const e = $(id); if (!e) return;
    e.textContent = txt;
    e.className = "v" + (cls ? " " + cls : "");
}

const ua  = navigator.userAgent;
const isPS4 = ua.includes("PlayStation 4");

if (!isPS4) {
    set("v-fw",  "not a PS4", "err");
    set("v-st",  "open on PS4 browser", "err");
} else {
    const { key, off } = offsetsFor(ua);
    set("v-fw", key || "unknown", key ? "ok" : "err");

    if (!key || !off) {
        set("v-ch",  "none", "err");
        set("v-off", "no offsets", "err");
        set("v-st",  "unsupported firmware", "err");
        $("v-note").textContent = "supported: 9.00 – 13.52";
    } else {
        const fw_n = parseInt(key.split(".")[0]) * 100 + parseInt(key.split(".")[1]);
        const bugMatch = off.fw_status && off.fw_status.match(/(?:^|\s)bug=(lapse|poops)(?:\s|$)/);
        const chain = bugMatch ? bugMatch[1] : (fw_n <= 1202 ? "lapse" : "poops");
        const target = chain === "lapse" ? "lapse.html" : "poops.html";

        set("v-ch",  chain, "ok");
        set("v-off", off.fw_status
            ? off.fw_status.split(" ")[0].replace("state=","")
            : "loaded", "ok");
        set("v-st",  "redirecting…", "ok");

        const n = $("v-note");
        n.textContent = key + " → " + target;

        setTimeout(() => { location.href = target; }, 600);
    }
}
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
