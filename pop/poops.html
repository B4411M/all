<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B41M poops</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #00ff00;
    font: 14px/1.5 "JetBrains Mono", "Fira Code", Consolas, monospace;
    text-transform: lowercase;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03), rgba(0,255,0,0.03) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 9999;
  }
  #container {
    max-width: 520px;
    margin: 60px auto;
    padding: 24px;
    border: 1px solid #00ff00;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,255,0,0.2), inset 0 0 20px rgba(0,255,0,0.05);
    background: rgba(0, 20, 0, 0.8);
  }
  #brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .3em;
    margin-bottom: 24px;
    color: #00ff00;
    text-shadow: 0 0 8px #00ff00;
    animation: flicker 2s infinite alternate;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  #wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #state {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
  }
  #out {
    white-space: pre-wrap;
    font: 12px/1.6 "JetBrains Mono", "Fira Code", Consolas, monospace;
    background: #001100;
    border: 1px solid #003300;
    border-radius: 4px;
    padding: 16px;
    max-height: 400px;
    overflow-y: auto;
    color: #00ff00;
    text-shadow: 0 0 3px #00ff00;
    text-transform: none;
  }
  #out::-webkit-scrollbar { width: 8px; }
  #out::-webkit-scrollbar-track { background: #001100; }
  #out::-webkit-scrollbar-thumb { background: #004400; border-radius: 4px; }
  #out::-webkit-scrollbar-thumb:hover { background: #006600; }
  .ok { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
  .bad { color: #ff3300; text-shadow: 0 0 5px #ff3300; text-decoration: underline; }
  .warn { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
  ::selection { background: #00ff00; color: #000000; }
  </style>
</head>
<body>
<div id="container">
  <div id="brand">B41M</div>
  <div id="wrap">
    <div id="state">loading poops chain...</div>
    <div id="out"></div>
  </div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
